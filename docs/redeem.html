<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>兑换授权 · AI Explorer</title>
  <meta name="description" content="使用闲鱼等渠道获得的兑换码，绑定机器码领取一年授权。" />
  <link rel="icon" href="favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1d1d1f;
      --mute: #6e6e73;
      --snow: #f5f5f7;
      --blue: #0071e3;
      --blue-h: #0077ed;
      --line: rgba(0,0,0,.08);
      --ok: #1b7f4e;
      --err: #c41e3a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Urbanist, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
      color: var(--ink);
      background: var(--snow);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }
    .nav {
      position: sticky; top: 0; z-index: 40;
      backdrop-filter: saturate(180%) blur(20px);
      background: rgba(245,245,247,.78);
      border-bottom: 1px solid var(--line);
    }
    .nav-inner {
      width: min(720px, calc(100% - 40px));
      margin: 0 auto;
      height: 48px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo {
      display: flex; align-items: center; gap: 10px;
      font-weight: 600; font-size: 15px; letter-spacing: -.02em;
    }
    .logo img { width: 28px; height: 28px; display: block; }
    .nav-links { display: flex; align-items: center; gap: 14px; }
    .nav-links a { font-size: 12px; font-weight: 600; color: var(--ink); }
    .nav-cta {
      font-size: 12px; font-weight: 600;
      color: #fff; background: var(--blue);
      padding: 6px 14px; border-radius: 980px;
    }
    .wrap {
      width: min(560px, calc(100% - 40px));
      margin: 56px auto 80px;
    }
    h1 {
      font-size: clamp(32px, 6vw, 44px);
      font-weight: 600;
      letter-spacing: -.04em;
      line-height: 1.1;
    }
    .sub {
      margin-top: 12px;
      color: var(--mute);
      font-size: 17px;
      font-weight: 300;
      line-height: 1.45;
    }
    .panel {
      margin-top: 28px;
      padding: 22px 0 0;
      border-top: 1px solid var(--line);
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    input[type="text"] {
      width: 100%;
      font: inherit;
      font-size: 15px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      outline: none;
    }
    input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(0,113,227,.18); }
    .hint {
      margin-top: 8px;
      font-size: 13px;
      color: var(--mute);
      line-height: 1.4;
    }
    .field + .field { margin-top: 18px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      margin-top: 22px;
      width: 100%;
      border: 0; cursor: pointer;
      color: #fff; background: var(--blue);
      font: inherit; font-size: 17px; font-weight: 600;
      padding: 14px 22px; border-radius: 980px;
    }
    .btn:hover { background: var(--blue-h); }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .msg {
      margin-top: 16px;
      font-size: 14px;
      line-height: 1.45;
      min-height: 1.2em;
    }
    .msg.err { color: var(--err); }
    .msg.ok { color: var(--ok); }
    .success-box { margin-top: 20px; display: none; }
    .success-box.show { display: block; }
    textarea {
      width: 100%;
      min-height: 180px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.4;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #fff;
      resize: vertical;
    }
    .row {
      display: flex; gap: 10px; flex-wrap: wrap;
      margin-top: 12px;
    }
    .btn-secondary {
      display: inline-flex;
      border: 0; cursor: pointer;
      background: #e8e8ed; color: var(--ink);
      font: inherit; font-size: 14px; font-weight: 600;
      padding: 10px 16px; border-radius: 980px;
    }
    .steps {
      margin-top: 36px;
      color: var(--mute);
      font-size: 14px;
      line-height: 1.55;
    }
    .steps strong { color: var(--ink); font-weight: 600; }
    footer {
      text-align: center;
      color: var(--mute);
      font-size: 12px;
      padding: 0 20px 40px;
    }
    footer a { color: var(--blue); }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a class="logo" href="./">
        <img src="media/icon.png" alt="" />
        AI Explorer
      </a>
      <div class="nav-links">
        <a href="buy.html">在线购买</a>
        <a class="nav-cta" href="https://github.com/lancexiang/AIExplorer/releases/latest">下载</a>
      </div>
    </div>
  </nav>

  <main class="wrap">
    <h1>兑换授权</h1>
    <p class="sub">适用于闲鱼等渠道获得的兑换码。填写兑换码与本机机器码，即可领取一年期 <code>.lic</code>（从本机首次激活起算）。</p>

    <section id="formPanel" class="panel">
      <div class="field">
        <label for="code">兑换码</label>
        <input id="code" type="text" autocomplete="off" spellcheck="false"
          placeholder="AIE-XXXX-XXXX-XXXX" />
        <p class="hint">闲鱼自动发货消息里的兑换码，可带或不带横线。</p>
      </div>
      <div class="field">
        <label for="machineId">机器码</label>
        <input id="machineId" type="text" autocomplete="off" spellcheck="false"
          placeholder="32 位十六进制，或粘贴 AIExplorer-MachineId:…" />
        <p class="hint">应用内：帮助 → 许可证状态 → 复制机器码。</p>
      </div>
      <button class="btn" id="redeemBtn" type="button">兑换并生成许可证</button>
      <p class="msg" id="formMsg" role="status"></p>
    </section>

    <section id="successPanel" class="panel success-box" aria-live="polite">
      <p class="msg ok" id="successMsg">兑换成功。</p>
      <label for="licenseText">许可证内容（.lic）</label>
      <textarea id="licenseText" readonly></textarea>
      <div class="row">
        <button class="btn-secondary" id="copyBtn" type="button">复制全部</button>
        <button class="btn-secondary" id="downloadBtn" type="button">下载 .lic 文件</button>
      </div>
      <p class="steps" style="margin-top:16px;">
        <strong>激活：</strong>打开 AI Explorer → 帮助 → 许可证状态 → 激活… → 粘贴上方内容或导入文件。
        每个兑换码仅可使用一次。
      </p>
    </section>

    <p class="steps">
      还没有兑换码？可在 <a href="buy.html" style="color:var(--blue);">在线购买</a>，
      或加入 QQ 群 <strong style="color:var(--ink);">1106799023</strong> / 闲鱼咨询个人收款。
    </p>
  </main>

  <footer>
    <a href="./">返回首页</a>
    ·
    <a href="buy.html">在线购买</a>
    ·
    <a href="https://github.com/lancexiang/AIExplorer/releases/latest">下载试用</a>
  </footer>

  <script>
    window.AIEXPLORER_LICENSE_API = "https://aiexplorer-license-api.xiangluo1019.workers.dev";
  </script>
  <script>
    (function () {
      var api = (window.AIEXPLORER_LICENSE_API || "").replace(/\/$/, "");
      var formMsg = document.getElementById("formMsg");
      var successPanel = document.getElementById("successPanel");
      var successMsg = document.getElementById("successMsg");
      var licenseText = document.getElementById("licenseText");
      var redeemBtn = document.getElementById("redeemBtn");
      var codeInput = document.getElementById("code");
      var machineInput = document.getElementById("machineId");

      function setErr(t) {
        formMsg.className = "msg err";
        formMsg.textContent = t || "";
      }

      redeemBtn.addEventListener("click", function () {
        if (!api || api.indexOf("YOUR_SUBDOMAIN") !== -1) {
          setErr("兑换 API 尚未配置。");
          return;
        }
        var code = (codeInput.value || "").trim();
        var machineId = (machineInput.value || "").trim();
        if (!code) {
          setErr("请填写兑换码。");
          codeInput.focus();
          return;
        }
        if (!machineId) {
          setErr("请填写机器码。");
          machineInput.focus();
          return;
        }
        redeemBtn.disabled = true;
        formMsg.className = "msg";
        formMsg.textContent = "正在兑换…";
        fetch(api + "/api/redeem", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code: code, machineId: machineId }),
        })
          .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
          .then(function (res) {
            if (!res.ok || !res.j.license) {
              throw new Error((res.j && res.j.error) || "兑换失败");
            }
            formMsg.textContent = "";
            successPanel.classList.add("show");
            successMsg.className = "msg ok";
            successMsg.textContent = "兑换成功（" + (res.j.code || "") + "）。请复制或下载下方许可证并在应用内激活。";
            licenseText.value = res.j.license;
          })
          .catch(function (e) {
            redeemBtn.disabled = false;
            setErr(e.message || String(e));
          });
      });

      document.getElementById("copyBtn").addEventListener("click", function () {
        if (!licenseText.value) return;
        navigator.clipboard.writeText(licenseText.value).then(function () {
          successMsg.className = "msg ok";
          successMsg.textContent = "已复制到剪贴板。请到应用内激活。";
        });
      });

      document.getElementById("downloadBtn").addEventListener("click", function () {
        if (!licenseText.value) return;
        var blob = new Blob([licenseText.value], { type: "application/json" });
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "AIExplorer-license.lic";
        a.click();
        URL.revokeObjectURL(a.href);
      });
    })();
  </script>
</body>
</html>
